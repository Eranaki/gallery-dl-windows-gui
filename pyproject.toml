[project]
name = "gallery-dl-windows-gui"
version = "0.1.0"
description = "Windows GUI for gallery-dl with portable EXE builds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gallery-dl>=1.31",
    "PySide6>=6.8",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
