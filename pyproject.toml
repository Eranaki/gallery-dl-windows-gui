[project]
name = "gallery-dl-windows-gui"
version = "0.1.0"
description = "First MVP of a Windows GUI for gallery-dl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gallery-dl>=1.31",
    "PySide6>=6.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
